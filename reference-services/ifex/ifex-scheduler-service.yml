---
name: ifex_scheduler
major_version: 2
minor_version: 1
description: Calendar-style scheduler for IFEX-defined services

namespaces:
  - name: core
    description: Core scheduling functionality

    enumerations:
      - name: job_status_t
        datatype: uint8
        description: Job execution status (vehicle-authoritative)
        options:
          - name: PENDING
            value: 0
            description: Job is scheduled but not yet executed
          - name: RUNNING
            value: 1
            description: Job is currently executing
          - name: COMPLETED
            value: 2
            description: Job completed successfully
          - name: FAILED
            value: 3
            description: Job execution failed
          - name: CANCELLED
            value: 4
            description: Job was cancelled

      - name: view_type_t
        datatype: uint8
        description: Calendar view types
        options:
          - name: DAY
            value: 0
            description: Daily view
          - name: WEEK
            value: 1
            description: Weekly view
          - name: MONTH
            value: 2
            description: Monthly view
          - name: RANGE
            value: 3
            description: Custom date range

      - name: wake_policy_t
        datatype: uint8
        description: Vehicle wake behavior for scheduled jobs
        options:
          - name: NO_WAKE
            value: 0
            description: Only run if vehicle is already awake
          - name: WAKE_REQUIRED
            value: 1
            description: Wake vehicle via RTC timer to run this job

      - name: sleep_policy_t
        datatype: uint8
        description: Vehicle sleep behavior during job execution
        options:
          - name: NORMAL
            value: 0
            description: Normal sleep behavior after job completes
          - name: INHIBIT
            value: 1
            description: Prevent sleep until job execution finishes

    structs:
      - name: job_t
        description: Complete job information
        members:
          - name: id
            datatype: string
            description: Unique job identifier
          - name: title
            datatype: string
            description: Human-readable job title
          - name: service
            datatype: string
            description: Target service name
          - name: method
            datatype: string
            description: Target method name
          - name: parameters
            datatype: string
            description: JSON-encoded method parameters
          - name: scheduled_time_ms
            datatype: uint64
            description: Scheduled execution time (epoch milliseconds UTC)
          - name: recurrence_rule
            datatype: string
            description: Cron expression or RFC 5545 RRULE
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: End time for recurring jobs (epoch milliseconds UTC)
            mandatory: false
          - name: paused
            datatype: boolean
            description: User intent - job should not be scheduled until resumed
            default: false
          - name: status
            datatype: job_status_t
            description: Current execution status (vehicle-authoritative)
          - name: created_at_ms
            datatype: uint64
            description: Creation timestamp (epoch milliseconds UTC)
          - name: updated_at_ms
            datatype: uint64
            description: Last update timestamp (epoch milliseconds UTC)
          - name: executed_at_ms
            datatype: uint64
            description: Last execution timestamp (epoch milliseconds UTC)
            mandatory: false
          - name: next_run_time_ms
            datatype: uint64
            description: Next scheduled run time (epoch milliseconds UTC)
            mandatory: false
          - name: error_message
            datatype: string
            description: Error message if failed
            mandatory: false
          - name: result
            datatype: string
            description: JSON-encoded result from service call
            mandatory: false
          - name: wake_policy
            datatype: wake_policy_t
            description: Whether to wake vehicle for this job
            mandatory: false
          - name: sleep_policy
            datatype: sleep_policy_t
            description: Sleep behavior during execution
            mandatory: false
          - name: wake_lead_time_s
            datatype: uint32
            description: Seconds before scheduled_time to wake vehicle
            mandatory: false

      - name: job_filter_t
        description: Filter criteria for retrieving jobs
        members:
          - name: start_time_ms
            datatype: uint64
            description: Range start (epoch milliseconds UTC)
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: Range end (epoch milliseconds UTC)
            mandatory: false
          - name: service
            datatype: string
            description: Filter by service name
            mandatory: false
          - name: status
            datatype: job_status_t
            description: Filter by status
            mandatory: false
          - name: has_status_filter
            datatype: boolean
            description: Whether to apply status filter
            mandatory: false
            default: false
          - name: include_completed
            datatype: boolean
            description: Include completed jobs
            default: false
          - name: paused_only
            datatype: boolean
            description: Only return paused jobs
            mandatory: false
            default: false

      - name: job_create_t
        description: Information needed to create a new job
        members:
          - name: job_id
            datatype: string
            description: Optional job ID (if empty, scheduler generates one)
            mandatory: false
          - name: title
            datatype: string
            description: Human-readable job title
          - name: service
            datatype: string
            description: Target service name
          - name: method
            datatype: string
            description: Target method name
          - name: parameters
            datatype: string
            description: JSON-encoded method parameters
          - name: scheduled_time_ms
            datatype: uint64
            description: Scheduled execution time (epoch milliseconds UTC)
          - name: recurrence_rule
            datatype: string
            description: Cron expression (e.g., "0 8 * * MON-FRI") or RRULE
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: End time for recurring jobs (epoch milliseconds UTC)
            mandatory: false
          - name: paused
            datatype: boolean
            description: Create job in paused state
            mandatory: false
            default: false
          - name: wake_policy
            datatype: wake_policy_t
            description: Whether to wake vehicle for this job
            mandatory: false
          - name: sleep_policy
            datatype: sleep_policy_t
            description: Sleep behavior during execution
            mandatory: false
          - name: wake_lead_time_s
            datatype: uint32
            description: Seconds before scheduled_time to wake vehicle
            mandatory: false

      - name: job_update_t
        description: Fields that can be updated in an existing job
        members:
          - name: title
            datatype: string
            description: New title
            mandatory: false
          - name: scheduled_time_ms
            datatype: uint64
            description: New scheduled time (epoch milliseconds UTC)
            mandatory: false
          - name: recurrence_rule
            datatype: string
            description: New recurrence rule
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: New end time for recurring (epoch milliseconds UTC)
            mandatory: false
          - name: parameters
            datatype: string
            description: New JSON parameters
            mandatory: false
          - name: paused
            datatype: boolean
            description: New paused state
            mandatory: false
          - name: wake_policy
            datatype: wake_policy_t
            description: New wake policy
            mandatory: false
          - name: sleep_policy
            datatype: sleep_policy_t
            description: New sleep policy
            mandatory: false
          - name: wake_lead_time_s
            datatype: uint32
            description: New wake lead time in seconds
            mandatory: false

    methods:
      - name: create_job
        description: Create a new scheduled job
        input:
          - name: job
            datatype: job_create_t
            description: Job creation details
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether creation succeeded
          - name: job_id
            datatype: string
            description: Unique identifier for the created job
          - name: message
            datatype: string
            description: Success or error message

      - name: get_jobs
        description: Retrieve jobs based on filter criteria
        input:
          - name: filter
            datatype: job_filter_t
            description: Filter criteria (empty for all jobs)
            mandatory: false
        output:
          - name: success
            datatype: boolean
            description: Whether request succeeded
          - name: jobs
            datatype: job_t[]
            description: List of jobs matching criteria

      - name: get_job
        description: Retrieve a specific job by ID
        input:
          - name: job_id
            datatype: string
            description: Job identifier
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether job was found
          - name: job
            datatype: job_t
            description: Job details
            mandatory: false
          - name: message
            datatype: string
            description: Error message if not found
            mandatory: false

      - name: update_job
        description: Update an existing job
        input:
          - name: job_id
            datatype: string
            description: Job identifier to update
            mandatory: true
          - name: updates
            datatype: job_update_t
            description: Fields to update
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether update succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: delete_job
        description: Delete a scheduled job
        input:
          - name: job_id
            datatype: string
            description: Job identifier to delete
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether deletion succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: pause_job
        description: Pause a scheduled job (sets paused=true)
        input:
          - name: job_id
            datatype: string
            description: Job identifier to pause
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether pause succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: resume_job
        description: Resume a paused job (sets paused=false)
        input:
          - name: job_id
            datatype: string
            description: Job identifier to resume
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether resume succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: trigger_job
        description: Trigger immediate execution of a job (ignores schedule)
        input:
          - name: job_id
            datatype: string
            description: Job identifier to trigger
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether trigger succeeded
          - name: job
            datatype: job_t
            description: Updated job with execution result
            mandatory: false
          - name: message
            datatype: string
            description: Success or error message

      - name: get_calendar_view
        description: Get jobs formatted for calendar display
        input:
          - name: view_type
            datatype: view_type_t
            description: Type of calendar view
            mandatory: true
          - name: reference_time_ms
            datatype: uint64
            description: Reference time (epoch milliseconds UTC)
            mandatory: true
          - name: timezone
            datatype: string
            description: IANA timezone (e.g., "America/New_York")
            mandatory: false
            default: "UTC"
        output:
          - name: success
            datatype: boolean
            description: Whether request succeeded
          - name: start_time_ms
            datatype: uint64
            description: Actual start time of the view (epoch milliseconds UTC)
          - name: end_time_ms
            datatype: uint64
            description: Actual end time of the view (epoch milliseconds UTC)
          - name: jobs
            datatype: job_t[]
            description: Jobs within the date range
