---
name: scheduler_sync_envelope
major_version: 1
minor_version: 0
description: |
  Envelope format for synchronizing Scheduler state to cloud.

  Design principles for traffic minimization:
  - Delta sync: Only send changes, not full state
  - Terminal state sync: Sync COMPLETED/FAILED once with result, then forget
  - Batch execution results: Group multiple job completions
  - Compact status updates: Minimal payload for status-only changes
  - Sequence numbers: Enable gap detection and ordering
  - State checksum: Verify sync without full resync

namespaces:
  - name: scheduler_sync
    description: Scheduler state synchronization types

    enumerations:
      - name: sync_event_type_t
        datatype: uint8
        description: Types of sync events
        options:
          - name: FULL_SYNC
            value: 0
            description: Complete state snapshot (on startup/recovery)
          - name: JOB_CREATED
            value: 1
            description: New job was scheduled
          - name: JOB_UPDATED
            value: 2
            description: Job schedule/parameters changed
          - name: JOB_DELETED
            value: 3
            description: Job was removed
          - name: JOB_EXECUTED
            value: 4
            description: Job execution completed (success or failure)
          - name: HEARTBEAT
            value: 5
            description: No changes, bridge is alive

      - name: job_sync_status_t
        datatype: uint8
        description: Job status for sync (mirrors scheduler status)
        options:
          - name: PENDING
            value: 0
            description: Job waiting to execute
          - name: RUNNING
            value: 1
            description: Job currently executing
          - name: COMPLETED
            value: 2
            description: Job completed successfully
          - name: FAILED
            value: 3
            description: Job execution failed
          - name: CANCELLED
            value: 4
            description: Job was cancelled

      - name: wake_policy_t
        datatype: uint8
        description: Vehicle wake behavior for scheduled jobs
        options:
          - name: NO_WAKE
            value: 0
            description: Only run if vehicle is already awake
          - name: WAKE_REQUIRED
            value: 1
            description: Wake vehicle via RTC timer to run this job

      - name: sleep_policy_t
        datatype: uint8
        description: Vehicle sleep behavior during job execution
        options:
          - name: SLEEP_NORMAL
            value: 0
            description: Normal sleep behavior after job completes
          - name: INHIBIT_UNTIL_COMPLETE
            value: 1
            description: Prevent sleep until job execution finishes

    structs:
      - name: job_info_t
        description: Full job information for sync
        members:
          - name: job_id
            datatype: string
            description: Unique job identifier
          - name: title
            datatype: string
            description: Human-readable job title
          - name: service
            datatype: string
            description: Target service name
          - name: method
            datatype: string
            description: Target method name
          - name: parameters
            datatype: string
            description: JSON-encoded method parameters
          - name: scheduled_time
            datatype: string
            description: ISO 8601 scheduled datetime
          - name: recurrence_rule
            datatype: string
            description: Cron expression or RRULE (empty for one-time)
            mandatory: false
          - name: next_run_time
            datatype: string
            description: Next scheduled run for recurring jobs
            mandatory: false
          - name: status
            datatype: job_sync_status_t
            description: Current job status
          - name: wake_policy
            datatype: wake_policy_t
            description: Whether to wake vehicle for this job
            mandatory: false
          - name: sleep_policy
            datatype: sleep_policy_t
            description: Sleep behavior during execution
            mandatory: false
          - name: wake_lead_time_s
            datatype: uint32
            description: Seconds before scheduled_time to wake vehicle
            mandatory: false
          - name: created_at_ms
            datatype: uint64
            description: Creation timestamp (ms since epoch)
          - name: updated_at_ms
            datatype: uint64
            description: Last update timestamp (ms since epoch)

      - name: execution_result_t
        description: Result of a job execution (for JOB_EXECUTED events)
        members:
          - name: job_id
            datatype: string
            description: Job that was executed
          - name: status
            datatype: job_sync_status_t
            description: Execution result (COMPLETED or FAILED)
          - name: executed_at_ms
            datatype: uint64
            description: Execution timestamp (ms since epoch)
          - name: duration_ms
            datatype: uint32
            description: Execution duration in milliseconds
          - name: result
            datatype: string
            description: JSON result (for COMPLETED)
            mandatory: false
          - name: error_message
            datatype: string
            description: Error message (for FAILED)
            mandatory: false
          - name: next_run_time
            datatype: string
            description: Next scheduled run (for recurring jobs)
            mandatory: false

      - name: sync_event_t
        description: A single sync event
        members:
          - name: event_type
            datatype: sync_event_type_t
            description: Type of this event
          - name: sequence_number
            datatype: uint64
            description: Monotonic sequence number
          - name: timestamp_ns
            datatype: uint64
            description: Event timestamp (nanoseconds since epoch)
          - name: job_id
            datatype: string
            description: Related job ID (for job events)
            mandatory: false
          - name: job_info
            datatype: job_info_t
            description: Full job info (for CREATED/UPDATED)
            mandatory: false
          - name: execution_result
            datatype: execution_result_t
            description: Execution result (for JOB_EXECUTED)
            mandatory: false

      - name: sync_message_t
        description: Sync message containing one or more events
        members:
          - name: vehicle_id
            datatype: string
            description: Vehicle identifier
          - name: bridge_instance_id
            datatype: string
            description: Unique bridge instance ID (for restart detection)
          - name: events
            datatype: sync_event_t[]
            description: List of sync events (batched)
          - name: active_jobs_count
            datatype: uint32
            description: Total active (non-terminal) jobs
          - name: state_checksum
            datatype: uint32
            description: CRC32 of current active job state

      - name: sync_ack_t
        description: Cloud acknowledgment of sync message
        members:
          - name: last_sequence_received
            datatype: uint64
            description: Last sequence number received
          - name: checksum_match
            datatype: boolean
            description: Whether cloud checksum matches vehicle
          - name: request_full_sync
            datatype: boolean
            description: Cloud requests full sync (on mismatch)
