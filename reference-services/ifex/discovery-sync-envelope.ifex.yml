# Discovery Sync Envelope Schema
# Defines the message format for synchronizing Discovery service state to cloud
#
# Content ID: 201 (DISCOVERY_SYNC)
# Direction: Vehicle -> Cloud (v2c)
#
# Design principles:
# - Delta sync: Only send changes after initial full sync
# - Sequence numbers: Enable cloud to detect missed events
# - Checksums: Enable state verification without full resync

name: discovery_sync_envelope
version: 1.0.0
description: |
  Message envelope for synchronizing Discovery service state to cloud.
  Supports full sync on connection and incremental delta updates.

namespaces:
  - name: swdv.discovery_sync_envelope
    description: Discovery state synchronization messages

    typedefs:
      - name: service_status_t
        datatype: uint8
        description: Service availability status
        min: 0
        max: 4

    enumerations:
      - name: sync_event_type_t
        datatype: uint8
        description: Type of sync event
        options:
          - name: FULL_SYNC
            value: 0
            description: Complete state dump (on connect/reconnect)
          - name: SERVICE_REGISTERED
            value: 1
            description: New service registered
          - name: SERVICE_UNREGISTERED
            value: 2
            description: Service unregistered
          - name: SERVICE_STATUS_CHANGED
            value: 3
            description: Service status or heartbeat changed
          - name: HEARTBEAT
            value: 4
            description: Sync bridge heartbeat (no state change)

      - name: service_status_t
        datatype: uint8
        description: Service availability status
        options:
          - name: AVAILABLE
            value: 0
          - name: UNAVAILABLE
            value: 1
          - name: STARTING
            value: 2
          - name: STOPPING
            value: 3
          - name: ERROR
            value: 4

      - name: transport_type_t
        datatype: uint8
        description: Service transport protocol
        options:
          - name: GRPC
            value: 0
          - name: HTTP_REST
            value: 1
          - name: DBUS
            value: 2
          - name: SOMEIP
            value: 3
          - name: MQTT
            value: 4

    structs:
      - name: service_endpoint_t
        description: Service network endpoint
        members:
          - name: address
            datatype: string
            description: Host:port or URL
          - name: transport
            datatype: transport_type_t
            description: Transport protocol

      - name: method_info_t
        description: Service method metadata
        members:
          - name: name
            datatype: string
            description: Method name
          - name: description
            datatype: string
            description: Method description

      - name: namespace_info_t
        description: Service namespace with methods
        members:
          - name: name
            datatype: string
            description: Namespace name
          - name: methods
            datatype: method_info_t[]
            description: Methods in this namespace

      - name: service_info_t
        description: Complete service information
        members:
          - name: registration_id
            datatype: string
            description: Unique registration handle
          - name: name
            datatype: string
            description: Service name
          - name: version
            datatype: string
            description: Service version
          - name: description
            datatype: string
            description: Service description
          - name: endpoint
            datatype: service_endpoint_t
            description: Service endpoint
          - name: status
            datatype: service_status_t
            description: Current status
          - name: last_heartbeat_ms
            datatype: uint64
            description: Last heartbeat timestamp (unix ms)
          - name: namespaces
            datatype: namespace_info_t[]
            description: Service namespaces and methods

      - name: sync_event_t
        description: A single sync event
        members:
          - name: event_type
            datatype: sync_event_type_t
            description: Type of event
          - name: sequence_number
            datatype: uint64
            description: Monotonic sequence for ordering/gap detection
          - name: timestamp_ms
            datatype: uint64
            description: Event timestamp (milliseconds since Unix epoch)
          - name: registration_id
            datatype: string
            description: Affected service registration ID (empty for FULL_SYNC)
          - name: service_info
            datatype: service_info_t
            description: Service info (for REGISTERED, STATUS_CHANGED)

      - name: sync_message_t
        description: Sync message containing one or more events
        members:
          - name: vehicle_id
            datatype: string
            description: Source vehicle identifier
          - name: bridge_instance_id
            datatype: string
            description: Unique bridge instance (for restart detection)
          - name: events
            datatype: sync_event_t[]
            description: Batch of sync events
          - name: state_checksum
            datatype: uint32
            description: CRC32 of current state (for verification)
          - name: total_services
            datatype: uint32
            description: Total registered services count

      - name: sync_ack_t
        description: Acknowledgment from cloud (optional, for reliable sync)
        members:
          - name: last_sequence_received
            datatype: uint64
            description: Highest sequence number received
          - name: checksum_match
            datatype: bool
            description: Whether state checksums match
          - name: request_full_sync
            datatype: bool
            description: Cloud requests full resync

      # Hash-based sync protocol types (bandwidth-efficient)

      - name: hash_entry_t
        description: Service name to schema hash mapping
        members:
          - name: service_name
            datatype: string
            description: Service name
          - name: version
            datatype: string
            description: Service version
          - name: schema_hash
            datatype: string
            description: SHA-256 hash of IFEX schema

      - name: hash_list_t
        description: List of service schema hashes (vehicle → cloud manifest)
        members:
          - name: hashes
            datatype: hash_entry_t[]
            description: Service name to hash mappings

      - name: schema_request_t
        description: Cloud request for unknown schemas
        members:
          - name: hashes
            datatype: string[]
            description: SHA-256 hashes cloud wants full schemas for

      - name: schema_entry_t
        description: Hash to full schema mapping
        members:
          - name: schema_hash
            datatype: string
            description: SHA-256 hash
          - name: ifex_schema
            datatype: string
            description: Full IFEX YAML schema

      - name: schema_map_t
        description: Vehicle response with requested schemas
        members:
          - name: schemas
            datatype: schema_entry_t[]
            description: Hash to schema mappings

      - name: discovery_envelope_t
        description: Discovery sync envelope (hash-based protocol)
        members:
          - name: vehicle_id
            datatype: string
            description: Source vehicle identifier
          - name: instance_id
            datatype: string
            description: Bridge instance ID (for restart detection)
          - name: manifest
            datatype: hash_list_t
            description: Hash manifest (vehicle → cloud)
            mandatory: false
          - name: schema_request
            datatype: schema_request_t
            description: Schema request (cloud → vehicle)
            mandatory: false
          - name: schemas
            datatype: schema_map_t
            description: Schema response (vehicle → cloud)
            mandatory: false
