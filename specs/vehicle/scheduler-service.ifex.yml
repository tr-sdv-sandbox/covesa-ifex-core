---
name: ifex_scheduler
major_version: 2
minor_version: 1
description: Calendar-style scheduler for IFEX-defined services

includes:
  - file: specs/common/scheduler-types.ifex.yml
    description: Common scheduler types aligned with sync protocol v2

namespaces:
  - name: core
    description: Core scheduling functionality

    structs:
      # job_t is defined in scheduler_types (common types)
      # Vehicle and cloud both use scheduler_types.job_t

      - name: job_filter_t
        description: >
          Filter criteria for retrieving jobs.
          By default returns active (non-deleted) jobs.
          Set include_deleted=true to include tombstones (for sync protocol).
        members:
          # --- Range filters ---
          - name: start_time_ms
            datatype: uint64
            description: If set, only jobs with scheduled_time >= this value
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: If set, only jobs with scheduled_time <= this value
            mandatory: false
          # --- Match filters ---
          - name: service
            datatype: string
            description: If set, only jobs targeting this service
            mandatory: false
          - name: status
            datatype: scheduler_types.job_status_t
            description: If set (with has_status_filter=true), only jobs with this status
            mandatory: false
          - name: has_status_filter
            datatype: boolean
            description: Whether to apply status filter (needed because status enum has no "unset" value)
            mandatory: false
            default: false
          # --- Include filters (aligned with cloud API) ---
          - name: include_deleted
            datatype: boolean
            description: If true, include soft-deleted jobs (tombstones). Default false.
            mandatory: false
            default: false

      - name: job_create_t
        description: Information needed to create a new job
        members:
          - name: job_id
            datatype: string
            description: Optional job ID (if empty, scheduler generates one)
            mandatory: false
          - name: title
            datatype: string
            description: Human-readable job title
          - name: service
            datatype: string
            description: Target service name
          - name: method
            datatype: string
            description: Target method name
          - name: parameters_json
            datatype: string
            description: JSON-encoded method parameters
          - name: scheduled_time_ms
            datatype: uint64
            description: Scheduled execution time (epoch milliseconds UTC)
          - name: recurrence_rule
            datatype: string
            description: Cron expression (e.g., "0 8 * * MON-FRI") or RRULE
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: End time for recurring jobs (epoch milliseconds UTC)
            mandatory: false
          - name: paused
            datatype: boolean
            description: Create job in paused state
            mandatory: false
            default: false
          - name: wake_policy
            datatype: scheduler_types.wake_policy_t
            description: Whether to wake vehicle for this job
            mandatory: false
          - name: sleep_policy
            datatype: scheduler_types.sleep_policy_t
            description: Sleep behavior during execution
            mandatory: false
          - name: wake_lead_time_s
            datatype: uint32
            description: Seconds before scheduled_time to wake vehicle
            mandatory: false
          # Optional sync protocol fields (used by sync bridge when creating from cloud)
          - name: authority
            datatype: scheduler_types.job_authority_t
            description: Job authority (CLOUD or VEHICLE) - used by sync bridge
            mandatory: false
          - name: cloud_seq
            datatype: uint64
            description: Cloud version sequence - used by sync bridge
            mandatory: false
          - name: vehicle_seq
            datatype: uint64
            description: Vehicle version sequence - used by sync bridge
            mandatory: false
          - name: deleted
            datatype: boolean
            description: Soft delete flag - used by sync bridge for tombstones
            mandatory: false
          - name: deleted_at_ms
            datatype: uint64
            description: Deletion timestamp - used by sync bridge
            mandatory: false

      - name: job_update_t
        description: Fields that can be updated in an existing job
        members:
          - name: title
            datatype: string
            description: New title
            mandatory: false
          - name: scheduled_time_ms
            datatype: uint64
            description: New scheduled time (epoch milliseconds UTC)
            mandatory: false
          - name: recurrence_rule
            datatype: string
            description: New recurrence rule
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: New end time for recurring (epoch milliseconds UTC)
            mandatory: false
          - name: parameters_json
            datatype: string
            description: New JSON parameters
            mandatory: false
          - name: paused
            datatype: boolean
            description: New paused state
            mandatory: false
          - name: wake_policy
            datatype: scheduler_types.wake_policy_t
            description: New wake policy
            mandatory: false
          - name: sleep_policy
            datatype: scheduler_types.sleep_policy_t
            description: New sleep policy
            mandatory: false
          - name: wake_lead_time_s
            datatype: uint32
            description: New wake lead time in seconds
            mandatory: false
          # Optional sync protocol fields (used by sync bridge when updating from cloud)
          - name: authority
            datatype: scheduler_types.job_authority_t
            description: Job authority - used by sync bridge
            mandatory: false
          - name: cloud_seq
            datatype: uint64
            description: Cloud version sequence - used by sync bridge
            mandatory: false
          - name: vehicle_seq
            datatype: uint64
            description: Vehicle version sequence - used by sync bridge
            mandatory: false
          - name: deleted
            datatype: boolean
            description: Soft delete flag - used by sync bridge for tombstones
            mandatory: false
          - name: deleted_at_ms
            datatype: uint64
            description: Deletion timestamp - used by sync bridge
            mandatory: false

      - name: execution_t
        description: >
          Immutable record of a job execution.
          Executions are append-only facts - they never conflict.
        members:
          - name: execution_id
            datatype: string
            description: Globally unique execution identifier
          - name: job_id
            datatype: string
            description: Job that was executed
          - name: executed_at_ms
            datatype: uint64
            description: When execution started (epoch ms)
          - name: duration_ms
            datatype: uint32
            description: Execution duration in milliseconds
          - name: status
            datatype: scheduler_types.job_status_t
            description: Result - JOB_STATUS_COMPLETED or JOB_STATUS_FAILED
          - name: result
            datatype: string
            description: JSON result (for completed jobs)
            mandatory: false
          - name: error_message
            datatype: string
            description: Error message (for failed jobs)
            mandatory: false

      - name: execution_filter_t
        description: >
          Filter criteria for retrieving executions.
          All filters are optional - empty filter returns all executions.
        members:
          - name: job_id
            datatype: string
            description: If set, only executions for this job
            mandatory: false
          - name: start_time_ms
            datatype: uint64
            description: If set, only executions with executed_at >= this value
            mandatory: false
          - name: end_time_ms
            datatype: uint64
            description: If set, only executions with executed_at <= this value
            mandatory: false
          - name: status
            datatype: scheduler_types.job_status_t
            description: If set (with has_status_filter=true), only executions with this status
            mandatory: false
          - name: has_status_filter
            datatype: boolean
            description: Whether to apply status filter
            mandatory: false
            default: false
          - name: limit
            datatype: int32
            description: Maximum number of executions to return (default 100)
            mandatory: false
          - name: offset
            datatype: int32
            description: Number of executions to skip (for pagination)
            mandatory: false

    methods:
      - name: create_job
        description: Create a new scheduled job
        input:
          - name: job
            datatype: job_create_t
            description: Job creation details
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether creation succeeded
          - name: job_id
            datatype: string
            description: Unique identifier for the created job
          - name: message
            datatype: string
            description: Success or error message

      - name: list_jobs
        description: Retrieve jobs based on filter criteria (empty filter = all jobs)
        input:
          - name: filter
            datatype: job_filter_t
            description: Filter criteria (empty for all jobs including tombstones)
            mandatory: false
        output:
          - name: success
            datatype: boolean
            description: Whether request succeeded
          - name: jobs
            datatype: scheduler_types.job_t[]
            description: List of jobs matching criteria

      - name: list_jobs_hash
        description: >
          Get a hash of the job state matching the filter criteria.
          Used for efficient change detection - poll this endpoint and only
          fetch full job list when hash changes. Uses same filter as list_jobs.
        input:
          - name: filter
            datatype: job_filter_t
            description: Filter criteria (same as list_jobs)
            mandatory: false
        output:
          - name: state_hash
            datatype: uint64
            description: xxHash64 of the filtered job state (IDs, versions, statuses)
          - name: job_count
            datatype: int32
            description: Number of jobs matching the filter

      - name: get_job
        description: Retrieve a specific job by ID
        input:
          - name: job_id
            datatype: string
            description: Job identifier
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether job was found
          - name: job
            datatype: scheduler_types.job_t
            description: Job details
            mandatory: false
          - name: message
            datatype: string
            description: Error message if not found
            mandatory: false

      - name: update_job
        description: Update an existing job
        input:
          - name: job_id
            datatype: string
            description: Job identifier to update
            mandatory: true
          - name: updates
            datatype: job_update_t
            description: Fields to update
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether update succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: delete_job
        description: Delete a scheduled job
        input:
          - name: job_id
            datatype: string
            description: Job identifier to delete
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether deletion succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: pause_job
        description: Pause a scheduled job (sets paused=true)
        input:
          - name: job_id
            datatype: string
            description: Job identifier to pause
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether pause succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: resume_job
        description: Resume a paused job (sets paused=false)
        input:
          - name: job_id
            datatype: string
            description: Job identifier to resume
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether resume succeeded
          - name: message
            datatype: string
            description: Success or error message

      - name: trigger_job
        description: Trigger immediate execution of a job (ignores schedule)
        input:
          - name: job_id
            datatype: string
            description: Job identifier to trigger
            mandatory: true
        output:
          - name: success
            datatype: boolean
            description: Whether trigger succeeded
          - name: job
            datatype: scheduler_types.job_t
            description: Updated job with execution result
            mandatory: false
          - name: message
            datatype: string
            description: Success or error message

      - name: list_executions
        description: >
          Retrieve execution history with optional filters.
          Returns immutable records of past job executions.
        input:
          - name: filter
            datatype: execution_filter_t
            description: Filter criteria (empty for all executions)
            mandatory: false
        output:
          - name: success
            datatype: boolean
            description: Whether request succeeded
          - name: executions
            datatype: execution_t[]
            description: List of executions matching criteria
          - name: total_count
            datatype: int32
            description: Total matching executions (for pagination)

      - name: list_executions_hash
        description: >
          Get a hash of the execution state matching the filter criteria.
          Used for efficient change detection - poll this endpoint and only
          fetch full execution list when hash changes.
        input:
          - name: filter
            datatype: execution_filter_t
            description: Filter criteria (same as list_executions)
            mandatory: false
        output:
          - name: state_hash
            datatype: uint64
            description: xxHash64 of the filtered execution state
          - name: execution_count
            datatype: int32
            description: Number of executions matching the filter
